<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Employee Attrition{% endblock %} | Decision Tree</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% set ep = request.endpoint %}
  <header class="navbar">
    <div class="container nav-inner">
      <a href="{{ url_for('home') }}" class="brand"><span class="brand-icon">🌳</span> AttritionTree</a>
      <button class="nav-toggle" id="navToggle" aria-label="Buka menu" aria-expanded="false">☰</button>
      <nav class="nav-links" id="navLinks" aria-label="Navigasi utama">
        <a class="nav-link {{ 'active' if ep == 'home' }}" href="{{ url_for('home') }}" {% if ep == 'home' %}aria-current="page"{% endif %}>Beranda</a>
        <a class="nav-link {{ 'active' if ep == 'predict' }}" href="{{ url_for('predict') }}" {% if ep == 'predict' %}aria-current="page"{% endif %}>Prediksi</a>
        <a class="nav-link {{ 'active' if ep == 'analysis' }}" href="{{ url_for('analysis') }}" {% if ep == 'analysis' %}aria-current="page"{% endif %}>Analisis Model</a>
        <a class="nav-link {{ 'active' if ep == 'about' }}" href="{{ url_for('about') }}" {% if ep == 'about' %}aria-current="page"{% endif %}>Tentang</a>
      </nav>
    </div>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="footer">
    <div class="container">
      <p>TA-05 Pembelajaran Mesin &middot; Decision Tree &middot; Prediksi Pengunduran Diri Karyawan</p>
      <p class="muted">Hasil prediksi bersifat pendukung keputusan, bukan penilaian final terhadap individu.</p>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
